name: sync apt mirror

on:
  push:
    branches: [main]
    paths: [scripts/setup-apt.sh]
  workflow_dispatch:
  workflow_call:
    secrets:
      APT_R2_ACCESS_KEY_ID:
        required: false
      APT_R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: apt-mirror
  queue: max

jobs:
  sync:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.APT_R2_ENDPOINT != '' && vars.APT_R2_BUCKET != ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'push' && 'refs/heads/main' || github.sha }}
        persist-credentials: false
    - name: Sync APT snapshot or setup script
      env:
        GH_TOKEN: ${{ github.token }}
        APT_R2_ENDPOINT: ${{ vars.APT_R2_ENDPOINT }}
        APT_R2_BUCKET: ${{ vars.APT_R2_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.APT_R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.APT_R2_SECRET_ACCESS_KEY }}
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [[ "$EVENT_NAME" == push ]]; then
          python3 scripts/mirror.py --setup-only
        else
          python3 scripts/mirror.py
        fi
